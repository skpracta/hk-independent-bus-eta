services:
  production:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${PRODUCTION_PORT:-8080}:8080"

  dev:
    build: ./docker
    restart: unless-stopped
    ports:
      - "${DEV_PORT:-5173}:443"
    volumes:
      - ./:/app
    command: 'bash ./docker/run.sh'
