services:
  production:
    image: ${IMAGE_NAME:-hk-independent-bus-eta}:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      additional_contexts:
        git: ./.git
    restart: unless-stopped
    ports:
      - "${PRODUCTION_PORT:-8080}:8080"

  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: build
      additional_contexts:
        git: ./.git
    restart: unless-stopped
    init: true
    ports:
      - "${DEV_PORT:-5173}:443"
    volumes:
      - ./:/app
      - dev_node_modules:/app/node_modules
    command: >-
      sh -c 'yarn install --frozen-lockfile --non-interactive && yarn start'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('https').get({hostname:'127.0.0.1',port:443,path:'/',rejectUnauthorized:false},
          response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  dev_node_modules:
